<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Geist; src: url('file:///workspace/algochess/node_modules/geist/dist/fonts/geist-sans/Geist-Bold.woff2'); font-weight: 700; }
* { margin: 0; padding: 0; }
html, body { width: 400px; height: 400px; overflow: hidden; }
body {
  background:
    radial-gradient(circle at 30% 22%, rgba(61,220,151,0.16), transparent 55%),
    radial-gradient(circle at 78% 85%, rgba(230,200,138,0.10), transparent 50%),
    radial-gradient(circle at 50% 50%, #10161f 0%, #0a0d12 72%);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.ring {
  position: absolute; inset: 22px; border-radius: 50%;
  border: 1.5px solid rgba(61,220,151,0.22);
}
.ring2 {
  position: absolute; inset: 34px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.05);
}
.knight {
  font-size: 220px; line-height: 1; color: #f4f7f5;
  text-shadow: 0 0 60px rgba(61,220,151,0.55), 0 0 18px rgba(61,220,151,0.35);
  transform: translateY(-8px);
}
</style></head><body>
<div class="ring"></div><div class="ring2"></div>
<div class="knight">&#9822;</div>
</body></html>
